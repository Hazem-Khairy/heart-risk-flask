<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Risk Assessment</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #4a4a4a;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #f9f9f9;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #007bff;
            background-color: #ffffff;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #e7f3ff;
            border-left: 6px solid #007bff;
            border-radius: 4px;
            text-align: center;
        }
        .result-title {
            font-size: 14px;
            color: #555555;
            margin: 0;
        }
        .result-value {
            font-size: 20px;
            font-weight: bold;
            color: #0056b3;
            margin: 5px 0 0 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Heart Risk Assessment</h2>
        
        <form method="POST">
            <label>Age</label>
            <input type="number" name="age" required step="any">

            <label>Heart Rate</label>
            <input type="number" name="heart_rate" required step="any">

            <label>Systolic Blood Pressure</label>
            <input type="number" name="systolic_blood_pressure" required step="any">

            <label>Oxygen Saturation (%)</label>
            <input type="number" name="oxygen_saturation" required step="any">

            <label>Body Temperature (°C)</label>
            <input type="number" name="body_temperature" required step="any">

            <label>Chest Pain Severity (1-10)</label>
            <input type="number" name="chest_pain_severity" required step="any">

            <label>Gender</label>
            <select name="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label>Smoker Status</label>
            <select name="smoker_status">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

            <label>Diabetes History</label>
            <select name="diabetes_history">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

            <button type="submit">Predict Risk Status</button>
        </form>

        {% if result %}
            <div class="result-box">
                <p class="result-title">Prediction Result</p>
                <p class="result-value">{{ result }}</p>
            </div>
        {% endif %}
    </div>

</body>
</html>
